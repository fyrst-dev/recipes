# CD / VPS image-based Compose stack (not the CLI-managed local compose).
# shopware-cli project create owns the shop-root compose.yaml used by
# `shopware-cli project dev`. This file is only the prod/CD stack.
#
# Invoke from the shop root (COMPOSE_DIR). Pass --env-file .env so interpolation
# reads shop-root `.env` (the compose file lives under deploy/, so Compose's
# default `.env` lookup would be deploy/.env).
#   docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.prod.yaml -f deploy/compose.vps.yaml ...
#
# Production overrides: deploy/compose.prod.yaml
# VPS pull/no-build:    deploy/compose.vps.yaml
#
# Paths (build context, env_file) are relative to this file under deploy/;
# shop root is `..`. Finish shop-root .env with fyrst-cli shopware env init
# (or copy .env.example → .env by hand). No real secrets belong here.
#
# Bundled MySQL: service name `mysql` (DATABASE_URL host = mysql).
# External DB:   set DATABASE_URL to the DBaaS DSN, delete or comment out
#                the `mysql` service, and drop it from depends_on.
#
# Optional profiles:
#   redis      — Redis 7
#   setup      — one-shot shopware-deployment-helper (CD / first install)
#   worker     — messenger:consume
#   scheduler  — scheduled-task:run
#
# Source of truth: SHOPWARE_SHOP_ID + SHOPWARE_DEPLOY_ENV in shop-root .env.
# Compose interpolates project name and bind-mount paths from those two (plus
# optional SHOPWARE_DATA_BASE). COMPOSE_PROJECT_NAME / SHOPWARE_DATA_ROOT are
# not required here — leave them unset unless a script/tool needs the expanded
# strings. Nested defaults like ${ROOT:-/base/${SHOP_ID}/...} do not expand
# in Compose; these are three separate interpolations concatenated with /.
#
# Project name (unique on this Docker host):
#   ${SHOPWARE_SHOP_ID}-${SHOPWARE_DEPLOY_ENV}   e.g. acme-live
# Scopes named volumes mysql_data / redis_data
# (acme-live_mysql_data vs acme-staging_mysql_data).
# Do not hardcode `name: shopware` (collides when several shops/envs share a host).
# Do not set COMPOSE_PROJECT_NAME= (empty) in .env — that env var overrides name:.
# shopware-cli project create writes COMPOSE_PROJECT_NAME=sw-shop-… into .env
# for local `project dev`. That value also overrides name:. On the VPS, remove
# or comment out that line so Compose uses shop id + deploy env. This recipe
# does not delete it (create owns the local flow).
#
# Runtime uploads are bind mounts (not named volumes):
#   ${SHOPWARE_DATA_BASE:-/var/lib/shopware/data}/${SHOPWARE_SHOP_ID}/${SHOPWARE_DEPLOY_ENV}
#   e.g. /var/lib/shopware/data/acme/live
# Create once per shop+env on the VPS (uid 82 = www-data in shopware docker-base):
#   DATA="${SHOPWARE_DATA_BASE:-/var/lib/shopware/data}/${SHOPWARE_SHOP_ID}/${SHOPWARE_DEPLOY_ENV}"
#   mkdir -p ${DATA}/{files,media,thumbnail,theme,sitemap}
#   chown -R 82:82 ${DATA}
# mysql_data / redis_data stay named volumes (auto-prefixed by project name).

name: "${SHOPWARE_SHOP_ID:?Set SHOPWARE_SHOP_ID in .env}-${SHOPWARE_DEPLOY_ENV:?Set SHOPWARE_DEPLOY_ENV in .env}"

x-shopware: &shopware
    image: ${IMAGE:?Set IMAGE in .env}:${IMAGE_TAG:-latest}
    build:
        # Shop root (parent of deploy/). dockerfile is relative to this context.
        context: ..
        # shopware/docker copies docker/Dockerfile. Missing it means that package was skipped.
        dockerfile: ${DOCKERFILE:-docker/Dockerfile}
        args:
            PHP_VERSION: ${PHP_VERSION:-8.3}
    env_file:
        -   ../.env
    volumes:
        -   "${SHOPWARE_DATA_BASE:-/var/lib/shopware/data}/${SHOPWARE_SHOP_ID}/${SHOPWARE_DEPLOY_ENV}/files:/var/www/html/files"
        -   "${SHOPWARE_DATA_BASE:-/var/lib/shopware/data}/${SHOPWARE_SHOP_ID}/${SHOPWARE_DEPLOY_ENV}/theme:/var/www/html/public/theme"
        -   "${SHOPWARE_DATA_BASE:-/var/lib/shopware/data}/${SHOPWARE_SHOP_ID}/${SHOPWARE_DEPLOY_ENV}/media:/var/www/html/public/media"
        -   "${SHOPWARE_DATA_BASE:-/var/lib/shopware/data}/${SHOPWARE_SHOP_ID}/${SHOPWARE_DEPLOY_ENV}/thumbnail:/var/www/html/public/thumbnail"
        -   "${SHOPWARE_DATA_BASE:-/var/lib/shopware/data}/${SHOPWARE_SHOP_ID}/${SHOPWARE_DEPLOY_ENV}/sitemap:/var/www/html/public/sitemap"

services:
    web:
        <<: *shopware
        ports:
            -   "${HTTP_PORT:-8000}:8000"
        depends_on:
            mysql:
                condition: service_healthy
                required: false
        healthcheck:
            # GET /api/_info/health-check — Shopware Core HealthCheckController
            # (auth_required=false). Official Docker HEALTHCHECK path. Proves Caddy
            # or nginx (or FrankenPHP) is serving :8000 AND the kernel answers.
            # FPM/Caddy/nginx docker-base images install curl (fpm/Dockerfile
            # `apk add curl`). FrankenPHP may not; PHP streams always exist.
            # 127.0.0.1 inside the container — not the Docker host network.
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS --max-time 4 http://127.0.0.1:8000/api/_info/health-check >/dev/null || php -r 'exit(@file_get_contents(\"http://127.0.0.1:8000/api/_info/health-check\")===false?1:0);'",
                ]
            interval: 10s
            timeout: 5s
            retries: 18
            start_period: 60s

    # One-shot install/update. Never compiles themes/assets (those are in the image).
    #   docker compose --env-file .env -f deploy/compose.yaml --profile setup run --rm setup
    setup:
        <<: *shopware
        profiles: ["setup"]
        restart: "no"
        depends_on:
            mysql:
                condition: service_healthy
                required: false
            init-perm:
                condition: service_completed_successfully
                required: false
        entrypoint:
            [
                "php",
                "vendor/bin/shopware-deployment-helper",
                "run",
                "--skip-theme-compile",
                "--skip-assets-install",
            ]

    # Bind-mount ownership for uid 82 (www-data in docker-base). Same profile as setup.
    init-perm:
        <<: *shopware
        profiles: ["setup"]
        user: "root"
        restart: "no"
        entrypoint:
            [
                "chown",
                "82:82",
                "/var/www/html/files",
                "/var/www/html/public/theme",
                "/var/www/html/public/media",
                "/var/www/html/public/thumbnail",
                "/var/www/html/public/sitemap",
            ]

    mysql:
        image: mysql:8.4
        # Shopware docs often use mariadb:11.4 — swap the image if you prefer MariaDB.
        command:
            -   --character-set-server=utf8mb4
            -   --collation-server=utf8mb4_unicode_ci
        env_file:
            -   ../.env
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE:-shopware}
            MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
        volumes:
            -   mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

    redis:
        image: redis:7-alpine
        profiles: ["redis"]
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            -   redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    worker:
        <<: *shopware
        profiles: ["worker"]
        depends_on:
            mysql:
                condition: service_healthy
                required: false
        entrypoint:
            [
                "php",
                "bin/console",
                "messenger:consume",
                "async",
                "low_priority",
                "--time-limit=300",
                "--memory-limit=512M",
            ]

    scheduler:
        <<: *shopware
        profiles: ["scheduler"]
        depends_on:
            mysql:
                condition: service_healthy
                required: false
        entrypoint: ["php", "bin/console", "scheduled-task:run"]

volumes:
    mysql_data:
    redis_data:
