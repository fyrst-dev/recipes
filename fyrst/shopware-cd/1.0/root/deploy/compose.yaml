# CD / VPS image-based Compose stack (not the CLI-managed local compose).
# shopware-cli project create owns the shop-root compose.yaml used by
# `shopware-cli project dev`. This file is only the prod/CD stack.
#
# Invoke from the shop root (COMPOSE_DIR):
#   docker compose -f deploy/compose.yaml -f deploy/compose.prod.yaml -f deploy/compose.vps.yaml ...
#
# Production overrides: deploy/compose.prod.yaml
# VPS pull/no-build:    deploy/compose.vps.yaml
#
# Paths (build context, env_file) are relative to this file under deploy/;
# shop root is `..`. Copy .env.example → .env at the shop root. No real secrets belong here.
#
# Bundled MySQL: service name `mysql` (DATABASE_URL host = mysql).
# External DB:   set DATABASE_URL to the DBaaS DSN, delete or comment out
#                the `mysql` service, and drop it from depends_on.
#
# Optional profiles:
#   redis      — Redis 7
#   setup      — one-shot shopware-deployment-helper (CD / first install)
#   worker     — messenger:consume
#   scheduler  — scheduled-task:run
#
# Project name: COMPOSE_PROJECT_NAME in shop-root .env (Compose also reads that
# env var with no `name:` key). Formula, set as a concrete value:
#   ${SHOPWARE_SHOP_ID}-${SHOPWARE_DEPLOY_ENV}   e.g. acme-live
# Must be unique on this Docker host — it scopes named volumes mysql_data /
# redis_data (acme-live_mysql_data vs acme-staging_mysql_data).
# Do not hardcode `name: shopware` (collides when several shops/envs share a host).
#
# Runtime uploads are bind mounts under SHOPWARE_DATA_ROOT (not named volumes).
# Formula (set the expanded path in .env; Compose does not nest ${A}/${B}):
#   /var/lib/shopware/data/${SHOPWARE_SHOP_ID}/${SHOPWARE_DEPLOY_ENV}
#   e.g. /var/lib/shopware/data/acme/live
# Create once per shop+env on the VPS (uid 82 = www-data in shopware docker-base):
#   mkdir -p ${SHOPWARE_DATA_ROOT}/{files,media,thumbnail,theme,sitemap}
#   chown -R 82:82 ${SHOPWARE_DATA_ROOT}
# mysql_data / redis_data stay named volumes.

name: "${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env}"

x-shopware: &shopware
    image: ${IMAGE:?Set IMAGE in .env}:${IMAGE_TAG:-latest}
    build:
        # Shop root (parent of deploy/). dockerfile is relative to this context.
        context: ..
        # shopware/docker copies docker/Dockerfile. Missing it means that package was skipped.
        dockerfile: ${DOCKERFILE:-docker/Dockerfile}
        args:
            PHP_VERSION: ${PHP_VERSION:-8.3}
    env_file:
        -   ../.env
    volumes:
        -   "${SHOPWARE_DATA_ROOT:?Set SHOPWARE_DATA_ROOT in .env}/files:/var/www/html/files"
        -   "${SHOPWARE_DATA_ROOT:?Set SHOPWARE_DATA_ROOT in .env}/theme:/var/www/html/public/theme"
        -   "${SHOPWARE_DATA_ROOT:?Set SHOPWARE_DATA_ROOT in .env}/media:/var/www/html/public/media"
        -   "${SHOPWARE_DATA_ROOT:?Set SHOPWARE_DATA_ROOT in .env}/thumbnail:/var/www/html/public/thumbnail"
        -   "${SHOPWARE_DATA_ROOT:?Set SHOPWARE_DATA_ROOT in .env}/sitemap:/var/www/html/public/sitemap"

services:
    web:
        <<: *shopware
        ports:
            -   "${HTTP_PORT:-8000}:8000"
        depends_on:
            mysql:
                condition: service_healthy
                required: false
        healthcheck:
            test: ["CMD-SHELL", "php -r 'exit(0);'"]
            interval: 10s
            timeout: 5s
            retries: 12
            start_period: 30s

    # One-shot install/update. Never compiles themes/assets (those are in the image).
    #   docker compose -f deploy/compose.yaml --profile setup run --rm setup
    setup:
        <<: *shopware
        profiles: ["setup"]
        restart: "no"
        depends_on:
            mysql:
                condition: service_healthy
                required: false
            init-perm:
                condition: service_completed_successfully
                required: false
        entrypoint:
            [
                "php",
                "vendor/bin/shopware-deployment-helper",
                "run",
                "--skip-theme-compile",
                "--skip-assets-install",
            ]

    # Bind-mount ownership for uid 82 (www-data in docker-base). Same profile as setup.
    init-perm:
        <<: *shopware
        profiles: ["setup"]
        user: "root"
        restart: "no"
        entrypoint:
            [
                "chown",
                "82:82",
                "/var/www/html/files",
                "/var/www/html/public/theme",
                "/var/www/html/public/media",
                "/var/www/html/public/thumbnail",
                "/var/www/html/public/sitemap",
            ]

    mysql:
        image: mysql:8.4
        # Shopware docs often use mariadb:11.4 — swap the image if you prefer MariaDB.
        command:
            -   --character-set-server=utf8mb4
            -   --collation-server=utf8mb4_unicode_ci
        env_file:
            -   ../.env
        environment:
            MYSQL_DATABASE: ${MYSQL_DATABASE:-shopware}
            MYSQL_USER: ${MYSQL_USER:?Set MYSQL_USER in .env}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
        volumes:
            -   mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

    redis:
        image: redis:7-alpine
        profiles: ["redis"]
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
            -   redis_data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    worker:
        <<: *shopware
        profiles: ["worker"]
        depends_on:
            mysql:
                condition: service_healthy
                required: false
        entrypoint:
            [
                "php",
                "bin/console",
                "messenger:consume",
                "async",
                "low_priority",
                "--time-limit=300",
                "--memory-limit=512M",
            ]

    scheduler:
        <<: *shopware
        profiles: ["scheduler"]
        depends_on:
            mysql:
                condition: service_healthy
                required: false
        entrypoint: ["php", "bin/console", "scheduled-task:run"]

volumes:
    mysql_data:
    redis_data:
