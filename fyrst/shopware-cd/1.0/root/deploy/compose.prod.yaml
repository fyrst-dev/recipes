# Production / VPS overrides. Used from the shop root as:
#   docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.prod.yaml -f deploy/compose.vps.yaml ...
#
# Put secrets in shop-root `.env` (required) and optional extra keys in `.env.prod`.
# Create an empty `.env.prod` on the VPS if you do not need overrides.
# Never commit filled env files.
# env_file paths are relative to this file under deploy/.

services:
    web:
        restart: unless-stopped
        env_file:
            -   ../.env
            -   ../.env.prod
        ports:
            # Loopback only. Host Caddy (deploy/edge/Caddyfile) terminates TLS.
            # Unsupported override (knowingly public app port): HTTP_BIND=0.0.0.0
            -   "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8000}:8000"
        healthcheck:
            # Same probe as compose.yaml; longer grace for cold VPS + setup helper.
            test:
                [
                    "CMD-SHELL",
                    "curl -fsS --max-time 4 http://127.0.0.1:8000/api/_info/health-check >/dev/null || php -r 'exit(@file_get_contents(\"http://127.0.0.1:8000/api/_info/health-check\")===false?1:0);'",
                ]
            interval: 10s
            timeout: 5s
            retries: 18
            start_period: 120s
        deploy:
            resources:
                limits:
                    cpus: "2"
                    memory: 1G
                reservations:
                    cpus: "0.50"
                    memory: 512M
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"

    mysql:
        restart: unless-stopped
        env_file:
            -   ../.env
            -   ../.env.prod
        # MySQL stays unpublished (no 0.0.0.0:3306). Do not add a host port.
        ports: []
        deploy:
            resources:
                limits:
                    cpus: "1"
                    memory: 1G
                reservations:
                    memory: 256M

    redis:
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    memory: 256M

    worker:
        restart: unless-stopped
        env_file:
            -   ../.env
            -   ../.env.prod
        deploy:
            replicas: 1
            resources:
                limits:
                    memory: 512M

    scheduler:
        restart: unless-stopped
        env_file:
            -   ../.env
            -   ../.env.prod

    setup:
        env_file:
            -   ../.env
            -   ../.env.prod
        restart: "no"

    init-perm:
        restart: "no"
